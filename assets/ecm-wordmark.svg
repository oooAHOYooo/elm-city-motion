<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 490" role="img" aria-labelledby="title desc">
  <title id="title">Elm City Motion</title>
  <desc id="desc">Editorial wordmark with a subtle motion exposure</desc>
  <defs>
    <filter id="soft-trail" x="-5%" y="-10%" width="125%" height="120%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-stretch="condensed" fill="#f7f5ef">
    <text x="0" y="178" font-size="180" font-weight="500" letter-spacing="-12">ELM CITY</text>
    <g opacity=".15" filter="url(#soft-trail)">
      <text x="32" y="415" font-size="218" font-weight="700" letter-spacing="-15">MOTION</text>
      <text x="18" y="415" font-size="218" font-weight="700" letter-spacing="-15">MOTION</text>
    </g>
    <text x="0" y="415" font-size="218" font-weight="700" letter-spacing="-15">MOTION</text>
  </g>
</svg>
